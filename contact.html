
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contact | TaleVerse</title>
  <meta name="description" content="Contact TaleVerse.">
  <meta property="og:title" content="Contact | TaleVerse">
  <meta property="og:description" content="Contact TaleVerse.">
  <meta name="theme-color" content="#0a0a0b">

  <link rel="icon" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

<header>
  <div class="wrap">
    <a class="brand" href="/">
      <span class="logo"></span>TaleVerse
    </a>

    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/behind-time.html">Behind Time</a>
      <a href="/hollowmere.html">Hollowmere</a>
      <a href="/news.html">News</a>
      <a href="/contact.html" aria-current="page">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section>

      <!-- CONTACT PAGE CONTENT -->
      <h2 id="contact-title">Contact</h2>

      <p id="contact-intro" style="max-width:620px"></p>

      <!-- CONTACT FORM -->
      <form id="contact-form">
        <input type="hidden" name="access_key">
        <input type="hidden" name="from_name" value="TaleVerse website">

        <input
          class="hp"
          type="checkbox"
          name="botcheck"
          tabindex="-1"
          autocomplete="off"
        >

        <label>
          Name
          <input name="name" required autocomplete="name">
        </label>

        <label>
          Email
          <input type="email" name="email" required autocomplete="email">
        </label>

        <label>
          Subject
          <input name="subject" required>
        </label>

        <label>
          Message
          <textarea name="message" rows="6" required></textarea>
        </label>

        <button class="btn solid" type="submit">
          Send message
        </button>

        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <!-- CUSTOM CONTACT SOCIAL LINKS -->
      <h2 id="contact-socials-title" style="margin-top:3rem">
        Follow TaleVerse
      </h2>

      <div class="socials" data-contact-socials></div>

    </section>
  </div>
</main>

<footer>
  <div class="wrap">

    <div class="brand" style="justify-content:center">
      <span class="logo"></span>TaleVerse
    </div>

    <p class="tag" data-site="tagline"></p>

    <!-- FOOTER SOCIAL LINKS FROM SITE SETTINGS -->
    <div class="socials" style="justify-content:center"></div>

    <small data-site="footer_note"></small>

    <p style="margin-top:1rem;font-size:.9rem">
      <a href="/privacy.html" style="color:var(--mute);text-decoration:none">
        Privacy Policy
      </a>
    </p>

  </div>
</footer>

<script src="/assets/app.js"></script>

</body>
</html>
